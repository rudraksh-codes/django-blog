{% extends 'base.html' %}


{% block content %}

<div class="row">
    <!-- Left SideBar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right SideContent -->
    <div class="col-md-8">
        <h3>All Categories</h3>
        <a href="{% url 'add_category' %}" class="btn btn-dark text-light float-end mb-2">Add New</a>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th >#</th>
                    <th >Category Name</th>
                    <th >Created At</th>
                    <th >Updated At</th>
                    <th >Action</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <th >{{ forloop.counter }}</th>
                    <td>{{ cat }}</td>
                    <td>{{ cat.created_at }}</td>
                    <td>{{ cat.updated_at }}</td>
                    <td>
                        <a href=""><i class='fa fa-edit text-success'></i></a>
                        &nbsp;
                        <a href=""><i class='fa fa-trash text-danger'></i></a>
                    </td>
                </tr>
                {% endfor %}
                
            </tbody>
        </table>
    </div>
</div>


{% endblock %}
