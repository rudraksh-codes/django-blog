{% extends 'base.html' %}
{% block content %}

<div class="row">
    <!-- left sidebar -->
    {% include 'dashboard/sidebar.html' %}
    <!-- Right SideContent -->
    <div class="col-md-8">
        <h3>All Posts</h3>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th >#</th>
                    <th >Category Name</th>
                    <th >Created At</th>
                    <th >Updated At</th>
                    <th >Action</th>
                </tr>
            </thead>
            <tbody>
                {% for post in posts %}
                <tr>
                    <th >{{ forloop.counter }}</th>
                    <td>{{ post }}</td>
                    <td>{{ post.created_at }}</td>
                    <td>{{ post.updated_at }}</td>
                    <td>
                        <a href=""><i class='fa fa-edit text-success'></i></a>
                        &nbsp;
                        <a href=""><i class='fa fa-trash text-danger'></i></a>
                    </td>
                </tr>
                {% endfor %}
                
            </tbody>
        </table>
    </div>

</div>


{% endblock %}
