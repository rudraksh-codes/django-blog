{% extends 'base.html' %}


{% block content %}


<div class="row">
    <!-- Left SideBar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right SideContent -->
    <div class="col-md-8">
        {% if perms.auth.delete_user %}
        <h3>ARE YOU SURE YOU WANT TO DELETE THIS USER ?</h3>
        <br>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">DELETE</button>
            <a href="{% url 'users' %}" class="btn btn-dark">Cancel</a>
        </form>
        {% else %}
        <h5 class="text-danger">You do not have the permission to view this page.</h5>
        {% endif %}
    </div>
</div>



{% endblock %}
